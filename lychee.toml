# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# Domínios abaixo bloqueiam o verificador automatizado do lychee (403/HTTP2), mas
# foram confirmados manualmente com HTTP 200 via curl (User-Agent de navegador) no
# momento da curadoria — ver logs/lote-3/guiadosuporte/results_final.tsv no relatório do agente.
# - linkedin.com: HTTP 999 a qualquer verificador automatizado, mesmo com o perfil no ar.
# - catho.com.br: 403 ao verificador do lychee, 200 confirmado via curl com UA de navegador.
# - gemini.google.com: erro de protocolo HTTP/2 no lychee, 200 confirmado via curl.
exclude = [
  "^https://www\\.linkedin\\.com/",
  "^https://www\\.catho\\.com\\.br/",
  "^https://gemini\\.google\\.com/",
]
